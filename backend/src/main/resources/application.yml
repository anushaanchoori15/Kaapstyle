server:
  port: 8080

spring:
  application:
    name: kaapstyle-backend
    
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kaapstyle_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:kaapstyle_user}
    password: ${DB_PASS:kaapstyle_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# KAAPSTYLE Application Config
kaapstyle:
  security:
    jwt:
      secret: ${JWT_SECRET:kaapstyle-development-secret-key-32-bytes-minimum!}
      expiration-ms: 86400000 # 24 hours
  storage:
    provider: local # S3-compatible when deployed
    upload-dir: ./uploads/photos
